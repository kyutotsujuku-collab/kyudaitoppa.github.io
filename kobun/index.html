<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>古文単語テスト</title>
<meta name="theme-color" content="#b3202a">
<style>
:root{--bg:#fff7f5;--card:#fff;--ink:#2a1516;--sub:#7a5a5c;--line:#f0d9d6;--acc:#b3202a;--acc2:#e0575f;--soft:#fde8e6;--gold:#c98a1a;--ok:#2d8a4e;--okbg:#e6f4ea;--ng:#c62828;--ngbg:#fdecea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;line-height:1.6;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
.mincho{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
header{position:sticky;top:0;z-index:10;background:var(--acc);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:17px;font-weight:700;flex:1;letter-spacing:.03em}
header .ver{font-size:11px;opacity:.8}
header a{color:#fff;text-decoration:none;font-size:12px;border:1px solid rgba(255,255,255,.6);border-radius:99px;padding:2px 10px}
main{max-width:680px;margin:0 auto;padding:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:11px;color:var(--sub);font-family:inherit;font-weight:700}
.tabs button span{display:block;font-size:19px;line-height:1.2}
.tabs button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:14px;margin:18px 2px 8px;color:var(--acc);letter-spacing:.06em}
h2:first-child{margin-top:2px}
.note{font-size:12px;color:var(--sub)}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 4px;font-size:13px;font-weight:700;color:var(--sub);font-family:inherit}
.seg button.on{background:#fff;color:var(--acc);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.sets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.set{position:relative;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-family:inherit;color:var(--ink)}
.set b{display:block;font-size:15px}
.set small{font-size:11px;color:var(--sub)}
.set .bar{height:5px;border-radius:9px;background:var(--soft);margin-top:6px;overflow:hidden}
.set .bar i{display:block;height:100%;background:var(--ok)}
.set.on{border-color:var(--acc);background:var(--soft);box-shadow:0 0 0 1px var(--acc) inset}
.big{display:block;width:100%;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:17px;font-weight:700;padding:14px;font-family:inherit;margin-top:12px}
.big:disabled{opacity:.4}
.big.ghost{background:#fff;color:var(--acc);border:1.5px solid var(--acc)}
.big.sm{font-size:13.5px;padding:9px 6px;margin-top:0}
.row{display:flex;gap:8px}.row>*{flex:1}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin-bottom:8px}
.prog .bar{flex:1;height:6px;border-radius:9px;background:var(--soft);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--acc)}
.q{text-align:center;padding:22px 12px 18px}
.q .pos{display:inline-block;font-size:11px;border:1px solid var(--acc2);color:var(--acc);border-radius:4px;padding:0 6px;margin-bottom:8px}
.q .w{font-size:32px;font-weight:700;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.q .w.sm{font-size:21px}
.q .k{font-size:14px;color:var(--sub);margin-top:4px;min-height:22px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-size:15.5px;font-family:inherit;color:var(--ink);line-height:1.5}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ng{border-color:var(--ng);background:var(--ngbg)}
.opt:disabled{color:var(--ink);opacity:1}
.opt .rev{display:block;margin-top:5px;padding-top:5px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--sub);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-weight:400}
.opt .rev b{font-size:15px;color:var(--acc);margin-right:2px}
.fb{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:14px}
.fb.ok{background:var(--okbg)}.fb.ng{background:var(--ngbg)}
.fb b{font-size:16px}
.fb .meta{font-size:12px;color:var(--sub);margin-top:4px}
.meta b{font-size:inherit}
.flip{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.flip .ans{margin-top:14px;font-size:18px;font-weight:700;color:var(--acc);border-top:1px dashed var(--line);padding-top:12px;width:100%}
.flip .tap{font-size:12px;color:var(--sub);margin-top:16px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat div{background:var(--soft);border-radius:10px;padding:10px 4px}
.stat b{display:block;font-size:22px;color:var(--acc);line-height:1.2}
.stat span{font-size:11px;color:var(--sub)}
.li{display:grid;grid-template-columns:1fr 1.25fr;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px;align-items:start}
.li .lw b{font-size:15.5px}
.li .lw small{display:block;font-size:11px;color:var(--sub)}
.li .lm{border-radius:6px;padding:1px 4px}
.hide .li .lm{background:var(--soft);color:transparent;cursor:pointer;user-select:none}
.hide .li .lm.show{background:none;color:inherit}
.li .st{font-size:10px;border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:2px}
.st.m{background:var(--okbg);color:var(--ok)}.st.x{background:var(--ngbg);color:var(--ng)}
input[type=search]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;font-family:inherit;margin-bottom:10px;background:#fff}
.ol{margin:4px 0 0;padding-left:1.3em}.ol li{margin:1px 0}
.link{background:none;border:0;color:var(--acc);font-family:inherit;font-size:12px;text-decoration:underline;padding:6px 0}
</style>

SETS.forEach(s => s.items = E.filter(s.f));
const KAKE = E.filter(e => e.kake);
const QUIZABLE = E.filter(e => !e.kake);
// ---------- 記録 ----------
const KEY = "kobun_tango_v1";
let S = {rec:{}, sets:["n1"], dir:"km", len:10, hide:true};
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (_) {}
S.dir = "km";   // 出題は「古文単語 → 訳」のみ
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (_) {} };
const rec = e => S.rec[e.id] || (S.rec[e.id] = {s:0, x:0});
const mastered = e => (S.rec[e.id] || {}).s >= 2;
const missed = e => (S.rec[e.id] || {}).x === 1;
function mark(e, ok) { const r = rec(e); if (ok) { r.s++; if (r.s >= 1) r.x = 0; } else { r.s = 0; r.x = 1; } save(); }
// ---------- 共通 ----------
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const main = document.getElementById("main"), tabsEl = document.getElementById("tabs");
const TABS = [["home","✎","テスト"],["card","▤","カード"],["list","☰","一覧"],["miss","✕","間違い"]];
let tab = "home", session = null;
function go(t) { tab = t; session = null; render(); scrollTo(0, 0); }
function render() {
  tabsEl.innerHTML = "";
  TABS.forEach(([id, ic, nm]) => { const b = $(`<button class="${tab === id ? "on" : ""}"><span>${ic}</span>${nm}</button>`); b.onclick = () => go(id); tabsEl.appendChild(b); });
  main.innerHTML = "";
  ({home, card, list, miss})[tab]();
}
const pool = () => { const ids = new Set(S.sets); const out = []; SETS.forEach(s => { if (ids.has(s.id)) out.push(...s.items); }); return out; };
function wordHtml(e, showK) {
  const sm = e.w.length > 9 ? " sm" : "";
  return `${e.p ? `<div class="pos">${esc(e.p)}</div>` : ""}<div class="w mincho${sm}">${esc(e.w)}</div><div class="k">${showK && e.k ? "（" + esc(e.k) + "）" : ""}</div>`;
}
function meanHtml(e) { return e.ms.length > 1 ? `<ol class="ol">${e.ms.map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : esc(e.ms[0]); }
function pgHtml(e) { const rs = (e.r || "").split("、").filter(Boolean); return e.pg.split("、").map(t => { const j = rs.indexOf(t); if (j < 0) return esc(t); rs.splice(j, 1); return `<b style="color:var(--acc)">${esc(t)}</b>`; }).join("、"); }
function metaHtml(e) { return `<div class="meta">${e.n ? "番号 " + e.n + "　" : "関連語　"}${e.k ? "漢字：" + esc(e.k) + "　" : ""}本 p.${pgHtml(e)}${e.note ? "<br>" + esc(e.note) : ""}</div>`; }
// ---------- ホーム（範囲選択）----------
function setPicker(box, onChange) {
  const allOn = SETS.every(x => S.sets.includes(x.id));
  const pick = $(`<div class="row" style="margin-bottom:2px"><button class="big ghost sm">${allOn ? "✓ 全範囲を選択中" : "全範囲を選ぶ"}</button><button class="big ghost sm">選択を外す</button></div>`);
  const [pa, pn] = pick.querySelectorAll("button");
  pa.onclick = () => { S.sets = SETS.map(x => x.id); save(); onChange(); };
  pn.onclick = () => { S.sets = []; save(); onChange(); };
  box.appendChild(pick);
  let g = "";
  let grid;
  SETS.forEach(s => {
    if (s.g !== g) { g = s.g; box.appendChild($(`<h2>${g}</h2>`)); grid = $(`<div class="sets"></div>`); box.appendChild(grid); }
    const m = s.items.filter(mastered).length, pct = s.items.length ? Math.round(m / s.items.length * 100) : 0;
    const b = $(`<button class="set ${S.sets.includes(s.id) ? "on" : ""}"><b>${s.name}</b><small>${s.items.length}語・覚えた ${m}（${pct}%）</small><div class="bar"><i style="width:${pct}%"></i></div></button>`);
    b.onclick = () => { S.sets = S.sets.includes(s.id) ? S.sets.filter(x => x !== s.id) : [...S.sets, s.id]; save(); onChange(); };
    grid.appendChild(b);
  });
}
function home() {
  const all = QUIZABLE, m = all.filter(mastered).length, x = all.filter(missed).length;
  main.appendChild($(`<div class="card"><div class="stat"><div><b>${m}</b><span>覚えた / ${all.length}語</span></div><div><b>${Math.round(m / all.length * 100)}%</b><span>達成度</span></div><div><b>${x}</b><span>間違い中</span></div></div>
   <div class="note" style="margin-top:8px">2回続けて正解すると「覚えた」になります。間違えると「間違い」に入り、正解すると外れます。</div></div>`));
  const len = $(`<div class="seg"><button data-n="10">10問</button><button data-n="20">20問</button><button data-n="0">範囲ぜんぶ</button></div>`);
  len.querySelectorAll("button").forEach(b => { b.className = S.len == b.dataset.n ? "on" : ""; b.onclick = () => { S.len = +b.dataset.n; save(); render(); }; });
  main.appendChild(len);
  const box = $(`<div></div>`); main.appendChild(box); setPicker(box, render);
  const p = pool(), px = p.filter(missed), pu = p.filter(e => !mastered(e));
  const b1 = $(`<button class="big" ${p.length ? "" : "disabled"}>テスト開始（選択中 ${p.length}語）</button>`);
  b1.onclick = () => startQuiz(pu.length ? [...shuffle(pu), ...shuffle(p.filter(mastered))] : shuffle(p));
  main.appendChild(b1);
  const au = QUIZABLE.filter(e => !mastered(e));
  const b0 = $(`<button class="big ghost">全範囲からテスト（${QUIZABLE.length}語から${S.len ? S.len + "問" : "ぜんぶ"}）</button>`);
  b0.onclick = () => startQuiz([...shuffle(au), ...shuffle(QUIZABLE.filter(mastered))]);
  main.appendChild(b0);
  const b2 = $(`<button class="big ghost" ${px.length ? "" : "disabled"}>この範囲の間違いだけ（${px.length}語）</button>`);
  b2.onclick = () => startQuiz(shuffle(px), true);
  main.appendChild(b2);
  main.appendChild($(`<div class="note" style="margin-top:14px">『マドンナ古文単語』の索引（暗記チェック式）に合わせています。番号・ページは本のものです（赤い数字が見出し語のページ）。記録はこのスマホの中だけに保存されます。</div>`));
}
// ---------- 4択テスト ----------
// 選択肢：品詞をそろえ、形や訳が似ていて紛らわしい別の語を選ぶ
const POSG = {"形":"adj","形動":"adj","名・形動":"adj","形動・副":"adj","動":"v","他動":"v","名+動":"v","名+格助+動":"v","名+格助+副助+動":"v","副+動":"v","動+助動":"v","接尾":"v","名":"n","代名":"n","副":"adv","名・副":"adv","副・接続":"adv","副／名・形動":"adv","副+終助":"adv","接続":"conj","連体":"rt","連体・副":"rt","感":"int","連語":"phr","格助+接尾":"phr"};
const posg = e => POSG[e.p] || "etc";
const norm = w => w.replace(/〔[^〕]*〕|[〜（）()「」、。+\s]/g, "");
const bigr = w => { const a = []; for (let i = 0; i < w.length - 1; i++) a.push(w.slice(i, i + 2)); return a; };
const toks = e => e.ms.flatMap(x => x.split("・")).map(x => x.replace(/^〔[^〕]*〕/, "").trim()).filter(Boolean);
E.forEach(e => { e.nw = norm(e.w); e.bg = bigr(e.nw); e.tk = new Set(toks(e)); e.kj = new Set((e.mt.match(/[一-龠]/g) || [])); });
function sim(a, b) {
  let sh = 0; const bb = b.bg.slice(); a.bg.forEach(x => { const k = bb.indexOf(x); if (k >= 0) { sh++; bb.splice(k, 1); } });
  const dice = a.bg.length + b.bg.length ? 2 * sh / (a.bg.length + b.bg.length) : 0;
  let pre = 0; while (pre < 3 && a.nw[pre] && a.nw[pre] === b.nw[pre]) pre++;
  let kj = 0; a.kj.forEach(c => { if (b.kj.has(c)) kj++; }); const ku = a.kj.size + b.kj.size - kj;
  return dice + 0.2 * pre + 0.6 * (ku ? kj / ku : 0) + (a.ms.length === b.ms.length ? 0.4 : 0) + (a.p === b.p ? 0.15 : 0);
}
function distractors(e, dir) {
  // 正解と訳が重なる語（別解になりうる語）と同じ番号の語は外す
  // 意味の向き（s: p=プラス, m=マイナス, b=両方, z=中立）が正反対の語も外す
  const opp = x => (e.s === "p" && x.s === "m") || (e.s === "m" && x.s === "p");
  const ok = x => x.id !== e.id && x.w !== e.w && x.mt !== e.mt && !(e.n && x.n === e.n) && ![...x.tk].some(t => e.tk.has(t)) && !opp(x);
  const all = QUIZABLE.filter(ok);
  let c = all.filter(x => x.p === e.p);
  if (c.length < 6) c = all.filter(x => posg(x) === posg(e));
  if (c.length < 6) c = all;
  const ranked = c.map(x => [sim(e, x) + (e.s === "b" ? (x.s !== "z" ? 0.4 : 0) : x.s === e.s ? 0.8 : x.s === "b" ? 0.4 : 0) + Math.random() * 0.25, x]).sort((a, b) => b[0] - a[0]).map(x => x[1]);
  const out = [], seen = new Set([dir === "km" ? e.mt : e.w]);
  for (const x of [...shuffle(ranked.slice(0, 5)), ...ranked.slice(5)]) { const key = dir === "km" ? x.mt : x.w; if (seen.has(key)) continue; seen.add(key); out.push(x); if (out.length === 3) break; }
  return out;
}
function startQuiz(items, all) {
  const n = all || !S.len ? items.length : Math.min(S.len, items.length);
  session = {items: items.slice(0, n), i: 0, ok: 0, wrong: []};
  quizStep();
}
function quizStep() {
  const s = session; main.innerHTML = ""; scrollTo(0, 0);
  if (s.i >= s.items.length) return quizEnd();
  const e = s.items[s.i], dir = S.dir;
  main.appendChild($(`<div class="prog"><span>${s.i + 1} / ${s.items.length}</span><div class="bar"><i style="width:${s.i / s.items.length * 100}%"></i></div><span>正解 ${s.ok}</span></div>`));
  const q = $(`<div class="card q"></div>`);
  q.innerHTML = dir === "km" ? wordHtml(e, false) : `<div class="pos">${esc(e.p || "—")}</div><div class="w sm" style="text-align:left">${meanHtml(e)}</div>`;
  main.appendChild(q);
  const opts = shuffle([e, ...distractors(e, dir)]), box = $(`<div class="opts"></div>`);
  opts.forEach(o => {
    const b = $(`<button class="opt ${dir === "mk" ? "mincho" : ""}">${dir === "km" ? esc(o.mt) : `<b style="font-size:18px">${esc(o.w)}</b>`}</button>`);
    b.onclick = () => {
      const ok = o.id === e.id; mark(e, ok); if (ok) s.ok++; else s.wrong.push(e);
      box.querySelectorAll("button").forEach((x, j) => { x.disabled = true; const o2 = opts[j]; if (o2.id === e.id) x.classList.add("ok");
        // 選んだ後：どの選択肢がどの単語（訳）だったかを見せる
        x.appendChild($(dir === "km" ? `<span class="rev"><b class="mincho">${esc(o2.w)}</b>${o2.k ? "（" + esc(o2.k) + "）" : ""}${o2.n ? "　番号 " + o2.n : "　関連語"}</span>` : `<span class="rev">${esc(o2.mt)}${o2.k ? "　（" + esc(o2.k) + "）" : ""}${o2.n ? "　番号 " + o2.n : "　関連語"}</span>`)); });
      if (!ok) b.classList.add("ng");
      if (dir === "km") q.querySelector(".k").textContent = e.k ? "（" + e.k + "）" : "";
      const quitEl = main.querySelector(".link"); main.insertBefore($(`<div class="fb ${ok ? "ok" : "ng"}"><b>${ok ? "○ 正解" : "✕ 不正解"}</b>　<span class="mincho" style="font-weight:700">${esc(e.w)}</span>${meanHtml(e).startsWith("<ol") ? meanHtml(e) : "：" + meanHtml(e)}${metaHtml(e)}</div>`), quitEl);
      const nx = $(`<button class="big">${s.i + 1 >= s.items.length ? "結果を見る" : "次へ"}</button>`);
      nx.onclick = () => { s.i++; quizStep(); }; main.insertBefore(nx, quitEl);
      nx.scrollIntoView({block: "nearest", behavior: "smooth"});
    };
    box.appendChild(b);
  });
  main.appendChild(box);
  const quit = $(`<button class="link">やめて戻る</button>`); quit.onclick = () => go("home"); main.appendChild(quit);
}
function quizEnd() {
  const s = session, pct = Math.round(s.ok / s.items.length * 100);
  main.appendChild($(`<div class="card" style="text-align:center"><div class="note">結果</div><div style="font-size:40px;font-weight:700;color:var(--acc)">${s.ok} / ${s.items.length}</div><div>${pct}%</div></div>`));
  if (s.wrong.length) {
    const c = $(`<div class="card"><b>間違えた語</b></div>`);
    s.wrong.forEach(e => c.appendChild($(`<div class="li"><div class="lw"><b class="mincho">${esc(e.w)}</b><small>${e.n ? "番号 " + e.n : "関連語"}・p.${esc(e.pg)}</small></div><div class="lm">${meanHtml(e)}</div></div>`)));
    main.appendChild(c);
    const r = $(`<button class="big">間違えた語をもう一度</button>`); r.onclick = () => startQuiz(shuffle(s.wrong), true); main.appendChild(r);
  }
  const h = $(`<button class="big ghost">範囲選択に戻る</button>`); h.onclick = () => go("home"); main.appendChild(h);
}
// ---------- カード ----------
function card() {
  if (!session) {
    main.appendChild($(`<div class="note" style="margin-bottom:8px">範囲を選んでカードをめくります。「覚えた」「まだ」は達成度に反映されます。</div>`));
    const box = $(`<div></div>`); main.appendChild(box); setPicker(box, render);
    const p = pool(), pu = p.filter(e => !mastered(e));
    const b = $(`<button class="big" ${p.length ? "" : "disabled"}>まだ覚えていない語（${pu.length}語）</button>`);
    b.disabled = !pu.length; b.onclick = () => { session = {items: shuffle(pu), i: 0}; render(); }; main.appendChild(b);
    const b2 = $(`<button class="big ghost" ${p.length ? "" : "disabled"}>選択中ぜんぶ（${p.length}語）</button>`);
    b2.onclick = () => { session = {items: shuffle(p), i: 0}; render(); }; main.appendChild(b2);
    if (KAKE.length) { const b3 = $(`<button class="big ghost">掛詞（${KAKE.length}語）</button>`); b3.onclick = () => { session = {items: KAKE.slice(), i: 0, kake: true}; render(); }; main.appendChild(b3); }
    return;
  }
  const s = session;
  if (s.i >= s.items.length) { main.appendChild($(`<div class="card" style="text-align:center">おつかれさま。${s.items.length}語めくりました。</div>`)); const h = $(`<button class="big">戻る</button>`); h.onclick = () => go("card"); main.appendChild(h); return; }
  const e = s.items[s.i];
  main.appendChild($(`<div class="prog"><span>${s.i + 1} / ${s.items.length}</span><div class="bar"><i style="width:${s.i / s.items.length * 100}%"></i></div></div>`));
  const c = $(`<div class="card flip">${wordHtml(e, false)}<div class="tap">タップして答えを見る</div></div>`);
  main.appendChild(c);
  const btns = $(`<div class="row" style="visibility:hidden"><button class="big ghost">まだ</button><button class="big">覚えた</button></div>`);
  c.onclick = () => {
    if (c.dataset.open) return; c.dataset.open = 1; c.querySelector(".tap").remove();
    c.appendChild($(`<div class="ans">${e.kake ? esc(e.ms[0]) : meanHtml(e)}</div>`)); c.appendChild($(`<div class="note">${metaHtml(e)}</div>`));
    btns.style.visibility = "visible";
  };
  const [no, yes] = btns.querySelectorAll("button");
  no.onclick = () => { if (!s.kake) mark(e, false); s.i++; render(); };
  yes.onclick = () => { if (!s.kake) { const r = rec(e); r.s = Math.max(r.s, 1); mark(e, true); } s.i++; render(); };
  main.appendChild(btns);
  const quit = $(`<button class="link">やめて戻る</button>`); quit.onclick = () => go("card"); main.appendChild(quit);
}
// ---------- 一覧 ----------
function listRows(items, box) {
  items.forEach(e => {
    const st = e.kake ? "" : mastered(e) ? `<span class="st m">覚えた</span>` : missed(e) ? `<span class="st x">間違い</span>` : "";
    const r = $(`<div class="li"><div class="lw"><b class="mincho">${esc(e.w)}</b>${st}<small>${e.n ? "番号 " + e.n : e.kake ? "掛詞" : "関連語"}${e.p ? "・" + esc(e.p) : ""}${e.k && !e.kake ? "・" + esc(e.k) : ""}・p.${esc(e.pg)}</small></div><div class="lm">${meanHtml(e)}</div></div>`);
    r.querySelector(".lm").onclick = ev => ev.currentTarget.classList.toggle("show");
    box.appendChild(r);
  });
}
function list() {
  const inp = $(`<input type="search" placeholder="古文単語・訳・番号でさがす">`); main.appendChild(inp);
  const seg = $(`<div class="seg"><button data-h="1">訳をかくす（タップで表示）</button><button data-h="0">訳を表示</button></div>`);
  main.appendChild(seg);
  const box = $(`<div class="card"></div>`); main.appendChild(box);
  const draw = () => {
    seg.querySelectorAll("button").forEach(b => b.className = (S.hide ? "1" : "0") === b.dataset.h ? "on" : "");
    box.className = "card" + (S.hide ? " hide" : ""); box.innerHTML = "";
    const q = inp.value.trim();
    const items = q ? E.filter(e => e.w.includes(q) || e.mt.includes(q) || e.k.includes(q) || String(e.n) === q) : E;
    box.appendChild($(`<div class="note">${items.length}語（本の索引順）</div>`));
    listRows(items, box);
  };
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { S.hide = b.dataset.h === "1"; save(); draw(); });
  inp.oninput = draw; draw();
}
// ---------- 間違い ----------
function miss() {
  const x = QUIZABLE.filter(missed);
  if (!x.length) { main.appendChild($(`<div class="card" style="text-align:center">間違い中の語はありません。</div>`)); return; }
  const b = $(`<button class="big" style="margin-top:0">間違いだけテスト（${x.length}語）</button>`); b.onclick = () => startQuiz(shuffle(x), true); main.appendChild(b);
  const box = $(`<div class="card" style="margin-top:12px"></div>`); listRows(x, box); main.appendChild(box);
  const r = $(`<button class="link">記録をすべて消す</button>`);
  r.onclick = () => { if (r.dataset.c) { S.rec = {}; save(); go("home"); } else { r.dataset.c = 1; r.textContent = "本当に消す（もう一度押す）"; } };
  main.appendChild(r);
}
render();
